<div class="form-header">
  <h2 class="font-display">Forgot your password?</h2>
  <p>Enter the email address on your account and we'll send you a link to reset it.</p>
</div>

<form method="post" *ngIf="!sentTo(); else sentTpl" [formGroup]="form" (ngSubmit)="onSubmit()">
  <!-- Email Field -->
  <div class="form-group">
    <label for="forgotEmail" class="form-label">Email Address</label>
    <input
      type="email"
      id="forgotEmail"
      formControlName="email"
      class="form-input"
      placeholder="you@company.com"
      autocomplete="email"
      [class.error]="isEmailInvalid()"
    />
    <span class="error-message" *ngIf="isEmailInvalid()">{{ getEmailError() }}</span>
  </div>

  <!-- Submit -->
  <button type="submit" class="btn-primary" [disabled]="isLoading()">
    <span *ngIf="!isLoading()">Send reset link</span>
    <span *ngIf="isLoading()" class="loading-spinner"></span>
  </button>

  <div class="error-alert" *ngIf="errorMessage()">{{ errorMessage() }}</div>
</form>

<!-- The same message whether or not the address has an account, so this page can't be used to find out which emails are registered. -->
<ng-template #sentTpl>
  <div class="success-alert" role="status">
    If an account exists for {{ sentTo() }}, a password reset link is on its way. Check your inbox.
  </div>
</ng-template>

<div class="auth-footer-link">
  Remembered it? <a routerLink="/">Back to sign in</a>
</div>
