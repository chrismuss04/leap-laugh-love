<div class="page-header">
  <p class="eyebrow">Business insights</p>
  <h1 class="font-display headline-page">Trading <em>Activity</em></h1>
  <p class="page-subtext">How much clients trade, what they trade, and how the client base grows.</p>
</div>

<app-period-filter [value]="filters.value()" (periodChange)="setPeriod($event)"></app-period-filter>

<section class="section" aria-label="Period summary">
  <p class="page-subtext" data-testid="period-summary">
    {{ periodLabel() }}:
    <time class="num" [attr.datetime]="filters.range().from">{{ filters.range().from | date: 'd MMM y' }}</time>
    –
    <time class="num" [attr.datetime]="filters.range().to">{{ filters.range().to | date: 'd MMM y' }}</time>
  </p>
  <div class="stats">
    <app-stat-tile label="Trading volume" hint="Value of filled orders"></app-stat-tile>
    <app-stat-tile label="Average order value" hint="Per filled order"></app-stat-tile>
    <app-stat-tile label="New registrations" hint="Clients who signed up"></app-stat-tile>
    <app-stat-tile label="Active clients" hint="Placed at least one order"></app-stat-tile>
  </div>
</section>

<section class="section" aria-label="Order activity">
  <app-activity-report></app-activity-report>
</section>

<!-- Long-range reports: always the last 12 complete months, not the period chosen above. -->
<section class="section" aria-labelledby="year-heading">
  <header class="year-header">
    <h2 id="year-heading" class="font-display year-title">The last 12 months</h2>
    <p class="year-range num" *ngIf="reportWindow.label() as range" data-testid="report-window">{{ range }}</p>
  </header>
  <div class="grid" role="region" aria-label="Business reports">
    <app-scorecard-report class="span-all"></app-scorecard-report>
    <app-retention-report class="span-all"></app-retention-report>
    <app-client-activity-report></app-client-activity-report>
    <app-activation-report></app-activation-report>
    <app-concentration-report></app-concentration-report>
    <app-order-size-report></app-order-size-report>
  </div>
</section>
