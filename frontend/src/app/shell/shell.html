<div class="shell fade-in">
  <header class="app-header">
    <div class="header-inner">
      <a routerLink="/dashboard" class="brand" aria-label="Leapfolio home">
        <span class="brand-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="9" width="3" height="6" rx="0.5" fill="#0d0d0f" />
            <rect x="6.5" y="5" width="3" height="10" rx="0.5" fill="#0d0d0f" />
            <rect x="12" y="1" width="3" height="14" rx="0.5" fill="#0d0d0f" />
          </svg>
        </span>
        <span class="brand-name">Leapfolio</span>
      </a>

      <nav class="main-nav" aria-label="Main">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
        <a routerLink="/orders" routerLinkActive="active" class="nav-link">Orders</a>
        <a routerLink="/holdings" routerLinkActive="active" class="nav-link">Holdings</a>
        <!-- No room on phones; the profile menu carries it there. -->
        <a routerLink="/accounts" routerLinkActive="active" class="nav-link wide-only">Accounts</a>
      </nav>

      <div class="header-right">
        <span class="live-status" [attr.data-status]="stream.status()" role="status">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="live-label">{{ statusLabel() }}</span>
        </span>

        <div class="profile" (keydown.escape)="closeMenu()">
          <button type="button" class="profile-button" (click)="toggleMenu()"
                  [attr.aria-expanded]="menuOpen()" aria-haspopup="menu">
            <span class="profile-text" *ngIf="!profileLoading(); else profileSkeleton">
              <span class="profile-name fade-in">{{ profile()?.fullName ?? 'My account' }}</span>
              <span class="profile-level fade-in" *ngIf="experienceLabel()">{{ experienceLabel() }}</span>
              <span class="profile-error fade-in" *ngIf="profileError()" role="alert">Couldn't load profile</span>
            </span>
            <ng-template #profileSkeleton>
              <span class="profile-text" aria-hidden="true">
                <span class="skeleton" style="display: block; width: 110px; height: 14px"></span>
              </span>
            </ng-template>
            <span class="avatar" aria-hidden="true">{{ profileLoading() ? '' : initials() }}</span>
          </button>

          <div class="menu-backdrop" *ngIf="menuOpen()" (click)="closeMenu()"></div>
          <div class="profile-menu" *ngIf="menuOpen()" role="menu">
            <div class="menu-identity">
              <span class="menu-name">{{ profile()?.fullName }}</span>
              <span class="menu-email">{{ profile()?.email }}</span>
            </div>
            <button type="button" class="menu-item" role="menuitem" routerLink="/profile" (click)="closeMenu()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="8" cy="5.5" r="2.75" />
                <path d="M2.75 14c.6-2.6 2.7-4.25 5.25-4.25s4.65 1.65 5.25 4.25" stroke-linecap="round" />
              </svg>
              Profile
            </button>
            <!-- The header's Accounts link is hidden on narrow screens, so the menu carries it there. -->
            <button type="button" class="menu-item narrow-only" role="menuitem" routerLink="/accounts" (click)="closeMenu()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <rect x="1.75" y="4.25" width="12.5" height="9" rx="1.5" />
                <path d="M5.5 4.25V3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.25M1.75 8.25h12.5" stroke-linecap="round" />
              </svg>
              Accounts
            </button>
            <button type="button" class="menu-item" role="menuitem" routerLink="/settings" (click)="closeMenu()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="8" cy="8" r="2.25" />
                <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke-linecap="round" />
              </svg>
              Account Settings
            </button>
            <button type="button" class="menu-item danger" role="menuitem" (click)="logout()">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M6 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1H6M10.5 11l3-3-3-3M13.5 8H6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              Log out
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="shell-main">
    <router-outlet></router-outlet>
  </main>
</div>
