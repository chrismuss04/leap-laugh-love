server:
  port: 8083

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paysprint}
    username: ${SPRING_DATASOURCE_USERNAME:paysprint}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      data-source-properties:
        # Has the Postgres driver send a JDBC batch as multi-row INSERTs instead of one
        # statement per row, so the candle flush's saveAll really is one round trip per batch.
        reWriteBatchedInserts: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Without this Hibernate defaults to 0 (batching off) and saveAll issues one INSERT
          # round trip per row, which is what makes the history backfill's bulk write scale
          # with instrument count rather than batch count. PriceCandle uses GenerationType.UUID,
          # so batching applies - an IDENTITY id would silently disable it.
          batch_size: 500
        order_inserts: true
  task:
    scheduling:
      # The simulation tick and the candle flush are both @Scheduled. On the default pool of 1
      # they share a thread, so a slow flush delays every instrument's next tick.
      pool-size: 4

app:
  jwt:
    secret: ${JWT_SECRET:verylongsecretkeyforjwttokengenerationspecifiedhere12345}
    expiration-minutes: 60

marketdata:
  simulation:
    tick-interval-ms: 1000
    # Every width listed here is accumulated from the same tick stream, so a chart at any
    # range reads candles that stay current. A candle is written only when its bucket rolls
    # over, so the wide widths cost a handful of inserts a day.
    candle-bucket-seconds: 60,300,3600,86400
    candle-flush-interval-ms: 5000
  history:
    backfill:
      # Generates synthetic history on first boot for instruments that have none, so charts
      # aren't limited to the current process's uptime. Skipped for any instrument that
      # already has candles, so this is a no-op on later boots. Turn off to run against
      # whatever history the database already holds.
      enabled: true
      step-seconds: 60
      # bucketSeconds:days - wider buckets reach further back, which is what keeps a year of
      # history to a few thousand rows per instrument.
      tiers: 86400:365,3600:90,300:7,60:2
    retention:
      # Drops candles that have aged out, so the table settles at the size the backfill created
      # instead of growing for as long as the service runs. Keep these tiers equal to the
      # backfill's, or the two disagree about how much history should exist. A width the
      # accumulator writes but this does not list is kept forever.
      enabled: true
      tiers: 86400:365,3600:90,300:7,60:2
      interval-ms: 3600000
      initial-delay-ms: 300000
  ingestion:
    spread-bps: 5
    default-lot-size: 100
    exchange: SIMULATED
    max-clock-skew-seconds: 5
    stale-after-seconds: 30
