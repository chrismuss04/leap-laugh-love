server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  jwt:
    secret: verylongsecretkeyforjwttokengenerationspecifiedhere12345
    expiration-minutes: 60

marketdata:
  simulation:
    tick-interval-ms: 1000
    candle-bucket-seconds: 60,300,3600,86400
    candle-flush-interval-ms: 5000
  history:
    backfill:
      # Tests assert against data they set up themselves; generating a year of history on
      # every context start would both slow them down and put rows they didn't write in
      # front of them.
      enabled: false
