services:
  iam-app:
    image: "iam-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: iam-app/Dockerfile
    ports:
      - "${IAM_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

  trading-app:
    image: "trading-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: trading-app/Dockerfile
    ports:
      - "${TRADING_PORT:-8082}:8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MARKET_DATA_BASE_URL: http://market-data-app:8083

  market-data-app:
    image: "market-data-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: market-data-app/Dockerfile
    ports:
      - "${MARKETDATA_PORT:-8083}:8083"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # How much synthetic price history to generate on a first start against an empty
      # database. The defaults here are the full set a developer wants to chart against; CI
      # overrides them with a token amount, because it starts from an empty database on every
      # build and a year of history for the whole S&P 500 is ~3.8M rows it would immediately
      # throw away. See "Price history and candle widths" in the README.
      MARKETDATA_HISTORY_BACKFILL_ENABLED: "${MARKETDATA_BACKFILL_ENABLED:-true}"
      MARKETDATA_HISTORY_BACKFILL_TIERS: "${MARKETDATA_BACKFILL_TIERS:-86400:365,3600:90,300:7,60:2}"

  # Angular dev server with hot reload. Runs straight off the node image rather than a
  # Dockerfile, so there is nothing to rebuild when frontend code changes.
  #
  # It also proxies the browser's /api/** calls to the backends (see frontend/proxy.conf.js),
  # so 4200 is the only port that has to be reachable from the browser - the app works over
  # SSH port forwarding or against a remote host, not just on the Docker host itself.
  #
  # Still no depends_on: the proxy resolves its targets per request, so a backend that is
  # slower to start only affects calls made before it is up, not this container's startup.
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      # Keeps the 365MB install inside the container, not in the developer's checkout, and
      # stops a macOS/Windows host tree feeding wrong-architecture binaries to a linux
      # container. Docker still leaves an empty root-owned frontend/node_modules mountpoint
      # on the host; it is git-ignored and "docker compose down -v" is what clears the
      # contents.
      - frontend_node_modules:/app/node_modules
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      # Override proxy.conf.js's localhost defaults with the compose service names.
      IAM_PROXY_TARGET: http://iam-app:8081
      TRADING_PROXY_TARGET: http://trading-app:8082
      MARKETDATA_PROXY_TARGET: http://market-data-app:8083
    # --poll: inotify events do not cross a bind mount on Docker Desktop, so without it
    # hot reload silently does nothing for everyone not on linux.
    command: >
      sh -c "[ -d node_modules/@angular/core ] || npm ci --no-audit --no-fund;
             exec npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paysprint
      POSTGRES_USER: paysprint
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysprint -d paysprint"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./iam-app/src/main/resources/db/leap_laugh_love_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./iam-app/src/main/resources/db/seed_iam.sql:/docker-entrypoint-initdb.d/02-seed-iam.sql:ro
      - ./iam-app/src/main/resources/db/seed_trading.sql:/docker-entrypoint-initdb.d/03-seed-trading.sql:ro
      - ./iam-app/src/main/resources/db/seed_marketdata.sql:/docker-entrypoint-initdb.d/04-seed-marketdata.sql:ro
      - ./iam-app/src/main/resources/db/seed_sp500_marketdata.sql:/docker-entrypoint-initdb.d/05-seed-sp500-marketdata.sql:ro
      - ./iam-app/src/main/resources/db/seed_sp500_trading.sql:/docker-entrypoint-initdb.d/06-seed-sp500-trading.sql:ro

volumes:
  db_data:
  frontend_node_modules:
