services:
  iam-app:
    image: "iam-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: iam-app/Dockerfile
    ports:
      - "${IAM_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ACCOUNT_SERVICE_BASE_URL: http://account-app:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLIENT_REGISTRATION_EVENTS_ENABLED: "${CLIENT_REGISTRATION_EVENTS_ENABLED:-true}"

  account-app:
    image: "account-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: account-app/Dockerfile
    ports:
      - "${ACCOUNT_PORT:-8082}:8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MARKET_DATA_BASE_URL: http://market-data-app:8083
      # Inactive account emails go to the local mail catcher below, never to a real inbox.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025

  order-app:
    image: "order-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: order-app/Dockerfile
    ports:
      - "${ORDER_PORT:-8084}:8084"
    depends_on:
      db:
        condition: service_healthy
      # Completed orders are published to order-events, which has to exist first: the broker
      # doesn't create topics on first use.
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MARKET_DATA_BASE_URL: http://market-data-app:8083
      ACCOUNT_SERVICE_BASE_URL: http://account-app:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  market-data-app:
    image: "market-data-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: market-data-app/Dockerfile
    ports:
      - "${MARKETDATA_PORT:-8083}:8083"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # How much synthetic price history to generate on a first start against an empty
      # database. The defaults here are the full set a developer wants to chart against; CI
      # overrides them with a token amount, because it starts from an empty database on every
      # build and a year of history for the whole S&P 500 is ~3.8M rows it would immediately
      # throw away. See "Price history and candle widths" in the README.
      MARKETDATA_HISTORY_BACKFILL_ENABLED: "${MARKETDATA_BACKFILL_ENABLED:-true}"
      MARKETDATA_HISTORY_BACKFILL_TIERS: "${MARKETDATA_BACKFILL_TIERS:-86400:365,3600:90,300:7,60:2}"

  # Angular dev server with hot reload. Runs straight off the node image rather than a
  # Dockerfile, so there is nothing to rebuild when frontend code changes.
  #
  # It also proxies the browser's /api/** calls to the backends (see frontend/proxy.conf.js),
  # so 4200 is the only port that has to be reachable from the browser - the app works over
  # SSH port forwarding or against a remote host, not just on the Docker host itself.
  #
  # Still no depends_on: the proxy resolves its targets per request, so a backend that is
  # slower to start only affects calls made before it is up, not this container's startup.
  frontend:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      # Keeps the 365MB install inside the container, not in the developer's checkout, and
      # stops a macOS/Windows host tree feeding wrong-architecture binaries to a linux
      # container. Docker still leaves an empty root-owned frontend/node_modules mountpoint
      # on the host; it is git-ignored and "docker compose down -v" is what clears the
      # contents.
      - frontend_node_modules:/app/node_modules
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      # Override proxy.conf.js's localhost defaults with the compose service names.
      IAM_PROXY_TARGET: http://iam-app:8081
      ACCOUNT_PROXY_TARGET: http://account-app:8082
      ORDER_PROXY_TARGET: http://order-app:8084
      MARKETDATA_PROXY_TARGET: http://market-data-app:8083
    # Reinstalls whenever package-lock.json differs from the one the volume was installed
    # from, not only when the volume is empty - otherwise a dependency upgrade keeps running
    # on the old packages until someone thinks to "docker compose down -v".
    #
    # --poll: inotify events do not cross a bind mount on Docker Desktop, so without it
    # hot reload silently does nothing for everyone not on linux.
    command: >
      sh -c "cmp -s package-lock.json node_modules/.installed-lock ||
             { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.installed-lock; } &&
             exec npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"

  # Single-node Kafka in KRaft mode (this node is both controller and broker, so there is no
  # ZooKeeper). Reachable only on the compose network, at kafka:9092 - no host port is
  # published, so nothing outside Docker can connect and CI builds cannot collide on a port.
  # The advertised address has to be the one clients use: a client bootstraps against it, then
  # reconnects to whatever the broker advertises.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One broker, so the internal topics cannot replicate to more than one.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared in kafka-init below, not created by whoever publishes first, so a
      # typo in a topic name fails loudly instead of quietly creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Keeps the broker from competing with five Spring apps and Postgres on a CI agent.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - kafka_data:/var/lib/kafka/data

  # One-shot: creates the topics once the broker is healthy, then exits. Idempotent, so it is
  # safe on every "up". Add new topics to this list.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic order-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic client-register --partitions 3 --replication-factor 1

  # Local mail catcher: services send email here over SMTP and it keeps every message instead
  # of delivering it, so no real inbox is ever reached. SMTP is reachable only on the compose
  # network, at mailpit:1025; the web UI that lists the caught emails is published on 8025.
  # No depends_on from the senders: a send is attempted only when an email goes out, and a
  # failed one is logged rather than failing the service.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
  # Order Reporting ETL: consumes order-events and loads each completed order into
  # reporting.orders (see reporting-etl/ and "Reporting ETL" in the README). No port: it only
  # reads Kafka and writes Postgres. Restarts on a crash; an offset is committed only after its
  # row is stored, so a restart re-reads rather than loses anything.
  reporting-etl:
    image: "reporting-etl:${IMAGE_TAG:-latest}"
    build:
      context: ./reporting-etl
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_EVENTS_TOPIC: order-events
      CONSUMER_GROUP: reporting-etl
      REPORTING_DB_URL: postgresql://paysprint:${DB_PASSWORD:-changeme}@db:5432/paysprint

  # Same ETL image, independent topic and consumer group for registrations.
  user-etl:
    image: "reporting-etl:${IMAGE_TAG:-latest}"
    build:
      context: ./reporting-etl
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      ETL_MODE: clients
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLIENT_EVENTS_TOPIC: client-register
      CONSUMER_GROUP: user-etl
      REPORTING_DB_URL: postgresql://paysprint:${DB_PASSWORD:-changeme}@db:5432/paysprint

  db:
    image: postgres:16-alpine
    # Persistent runs and recovery tests require durable commits. The disposable
    # CI overlay replaces this command with its existing performance settings.
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
    environment:
      POSTGRES_DB: paysprint
      POSTGRES_USER: paysprint
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysprint -d paysprint"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./iam-app/src/main/resources/db/leap_laugh_love_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./iam-app/src/main/resources/db/seed_iam.sql:/docker-entrypoint-initdb.d/02-seed-iam.sql:ro
      - ./iam-app/src/main/resources/db/seed_trading.sql:/docker-entrypoint-initdb.d/03-seed-trading.sql:ro
      - ./iam-app/src/main/resources/db/seed_marketdata.sql:/docker-entrypoint-initdb.d/04-seed-marketdata.sql:ro
      - ./iam-app/src/main/resources/db/seed_sp500_marketdata.sql:/docker-entrypoint-initdb.d/05-seed-sp500-marketdata.sql:ro
      - ./iam-app/src/main/resources/db/seed_sp500_trading.sql:/docker-entrypoint-initdb.d/06-seed-sp500-trading.sql:ro

volumes:
  db_data:
    # Preserve the usual Compose name by default. For a persistent deployment, set
    # DB_VOLUME_NAME to the existing volume and DB_VOLUME_EXTERNAL=true in .env.
    name: "${DB_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_db_data}"
    external: ${DB_VOLUME_EXTERNAL:-false}
  kafka_data:
  frontend_node_modules:
