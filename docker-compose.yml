services:
  iam-app:
    image: "iam-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: iam-app/Dockerfile
    ports:
      - "${IAM_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

  trading-app:
    image: "trading-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: trading-app/Dockerfile
    ports:
      - "${TRADING_PORT:-8082}:8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MARKET_DATA_BASE_URL: http://market-data-app:8083

  market-data-app:
    image: "market-data-app:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: market-data-app/Dockerfile
    ports:
      - "${MARKETDATA_PORT:-8083}:8083"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

  # Angular dev server with hot reload. Runs straight off the node image rather than a
  # Dockerfile, so there is nothing to rebuild when frontend code changes.
  #
  # Deliberately no depends_on: the browser calls iam-app and trading-app directly on the
  # published host ports, this container never does, so it has no real dependency on them.
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      # Keeps the 365MB install inside the container, not in the developer's checkout, and
      # stops a macOS/Windows host tree feeding wrong-architecture binaries to a linux
      # container. Docker still leaves an empty root-owned frontend/node_modules mountpoint
      # on the host; it is git-ignored and "docker compose down -v" is what clears the
      # contents.
      - frontend_node_modules:/app/node_modules
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    # --poll: inotify events do not cross a bind mount on Docker Desktop, so without it
    # hot reload silently does nothing for everyone not on linux.
    command: >
      sh -c "[ -d node_modules/@angular/core ] || npm ci --no-audit --no-fund;
             exec npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paysprint
      POSTGRES_USER: paysprint
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysprint -d paysprint"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./iam-app/src/main/resources/db/leap_laugh_love_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./iam-app/src/main/resources/db/seed_iam.sql:/docker-entrypoint-initdb.d/02-seed-iam.sql:ro
      - ./iam-app/src/main/resources/db/seed_trading.sql:/docker-entrypoint-initdb.d/03-seed-trading.sql:ro
      - ./iam-app/src/main/resources/db/seed_marketdata.sql:/docker-entrypoint-initdb.d/04-seed-marketdata.sql:ro

volumes:
  db_data:
  frontend_node_modules:
