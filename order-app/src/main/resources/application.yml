server:
  port: 8084

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paysprint}
    username: ${SPRING_DATASOURCE_USERNAME:paysprint}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  # SMTP server for client emails: Mailpit locally (see docker-compose.yml), a real provider in a
  # deployment. Username and password are empty for Mailpit, which needs no login.
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    # JavaMail waits forever by default; an unreachable server must not hang the sweep.
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  # Order Reporting: completed orders are published to Kafka (see OrderEventPublisher; the
  # serializers are set in OrderEventsKafkaConfig).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        # A send waits this long at most for the broker before failing, instead of the 60s
        # default, so a Kafka outage can't hold up an order response.
        max.block.ms: 2000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

# Email is best-effort: a mail server being down must not report order-app as unhealthy.
management:
  health:
    mail:
      enabled: false

reporting:
  events:
    enabled: ${REPORTING_EVENTS_ENABLED:true}
    topic: order-events
    # How long startup keeps trying to connect the producer before the first order completes
    # (see OrderEventsProducerWarmup).
    warmup-seconds: 30

app:
  jwt:
    secret: ${JWT_SECRET:verylongsecretkeyforjwttokengenerationspecifiedhere12345}
    expiration-minutes: 60

account:
  client:
    base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout-ms: 2000
    read-timeout-ms: 2000

marketdata:
  client:
    base-url: ${MARKET_DATA_BASE_URL:http://localhost:8083}
    connect-timeout-ms: 2000
    read-timeout-ms: 2000

order:
  execution:
    max-quote-age-seconds: 5
  notifications:
    # Emails a client when an order that waited fills, is refused or expires (see OrderFillMailer).
    email:
      enabled: ${ORDER_NOTIFICATIONS_EMAIL_ENABLED:true}
      from: ${ORDER_NOTIFICATIONS_EMAIL_FROM:no-reply@example.com}
      # Where the email's order history link points.
      history-url: ${ORDER_NOTIFICATIONS_HISTORY_URL:http://localhost:4200/orders}
      # How often finished orders are checked for an email still owed.
      interval-ms: 15000
      initial-delay-ms: 20000

trading:
  seeded-fills:
    # Book seed-data fills at market data prices once history exists (see SeededFillService).
    enabled: ${TRADING_SEEDED_FILLS_ENABLED:true}
    retry-seconds: 10
    max-attempts: 60
  fill-recovery:
    # Finish live fills a partial platform failure left part-way (see PendingFillRecovery).
    enabled: ${TRADING_FILL_RECOVERY_ENABLED:true}
    # Leave fills this recent alone: their submission may still be in flight.
    grace-seconds: 30
    initial-delay-ms: 15000
    interval-ms: 30000
  order-triggers:
    # Fill limit and stop orders once the market reaches their price (see OrderTriggerEngine).
    enabled: ${TRADING_ORDER_TRIGGERS_ENABLED:true}
    initial-delay-ms: 10000
    # Matches the market simulator's tick, so no price is missed.
    interval-ms: 1000
    # Expire DAY and GTC orders past their time in force.
    expiry-interval-ms: 30000
