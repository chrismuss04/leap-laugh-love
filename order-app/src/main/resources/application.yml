server:
  port: 8084

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paysprint}
    username: ${SPRING_DATASOURCE_USERNAME:paysprint}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:verylongsecretkeyforjwttokengenerationspecifiedhere12345}
    expiration-minutes: 60

account:
  client:
    base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout-ms: 2000
    read-timeout-ms: 2000

marketdata:
  client:
    base-url: ${MARKET_DATA_BASE_URL:http://localhost:8083}
    connect-timeout-ms: 2000
    read-timeout-ms: 2000

order:
  execution:
    max-quote-age-seconds: 5

trading:
  seeded-fills:
    # Book seed-data fills at market data prices once history exists (see SeededFillService).
    enabled: ${TRADING_SEEDED_FILLS_ENABLED:true}
    retry-seconds: 10
    max-attempts: 60
  fill-recovery:
    # Finish live fills a partial platform failure left part-way (see PendingFillRecovery).
    enabled: ${TRADING_FILL_RECOVERY_ENABLED:true}
    # Leave fills this recent alone: their submission may still be in flight.
    grace-seconds: 30
    initial-delay-ms: 15000
    interval-ms: 30000
