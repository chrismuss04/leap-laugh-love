server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  # Gives the context a mail sender. Tests that check the email mock it; elsewhere a failed send
  # is logged and ignored.
  mail:
    host: localhost
    port: 1025

management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: verylongsecretkeyforjwttokengenerationspecifiedhere12345
    expiration-minutes: 60
  password-reset:
    link-base-url: http://localhost:4200/reset-password
    token-ttl-minutes: 30
