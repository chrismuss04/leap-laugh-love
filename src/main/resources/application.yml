spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paysprint}
    username: ${SPRING_DATASOURCE_USERNAME:paysprint}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:please-override-this-secret-in-every-environment-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
