# Test Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/leap_laugh_love_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for Testing
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Initialize test database with schema and seed data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/leap_laugh_love_schema.sql,classpath:db/seed_iam.sql

# Logging
logging.level.root=WARN
logging.level.com.leap.leaplaughlove=INFO
