# CI-only overlay, applied by the Jenkinsfile on top of docker-compose.yml and
# docker-compose.e2e.yml. Not meant for local use: the volume below is external, so compose
# refuses to start without it, and the Jenkinsfile is what creates it.
services:
  db:
    # Every CI database is seeded from scratch and destroyed by "down -v" at the end of the
    # build, so durability buys nothing. With fsync off the S&P 500 seed loads noticeably faster.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]

  frontend:
    volumes:
      # The frontend container still runs "npm ci" into its own per-build node_modules volume,
      # but from this download cache instead of the network. Sharing the cache rather than
      # node_modules itself is deliberate: npm's cache is safe for concurrent builds of
      # different branches, whereas two builds installing into one node_modules would corrupt
      # each other. External so the build's "down -v" leaves it in place.
      - npm_cache:/tmp/.npm

volumes:
  npm_cache:
    external: true
    name: leap-ci-npm-cache
