<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JaCoCo Coverage Reports</title>
    <link rel="stylesheet" href="../theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--background); color: var(--foreground); line-height: 1.5; -webkit-font-smoothing: antialiased; }
        main { max-width: 1100px; margin: 0 auto; padding: 64px 24px; }
        .back { font-size: 13px; color: var(--muted-foreground); text-decoration: none; }
        .back:hover { color: var(--primary); }
        h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 32px; margin: 12px 0 32px; }
        section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 20px; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px; border-bottom: 1px solid var(--border); }
        h2 { font-size: 15px; font-weight: 600; }
        header a { font-size: 13px; color: var(--primary); text-decoration: none; }
        header a:hover { text-decoration: underline; }
        iframe { display: block; width: 100%; height: 450px; border: 0; background: var(--background); }
        a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <a class="back" href="../index.html">&larr; Documentation</a>
        <h1>Code coverage</h1>
        <!-- One <section> per module. Add a block when a module is added. -->
        <section><header><h2>account-app</h2><a href="account-app/index.html" target="_blank">Open full report</a></header><iframe src="account-app/index.html" title="account-app coverage"></iframe></section>
        <section><header><h2>common</h2><a href="common/index.html" target="_blank">Open full report</a></header><iframe src="common/index.html" title="common coverage"></iframe></section>
        <section><header><h2>iam-app</h2><a href="iam-app/index.html" target="_blank">Open full report</a></header><iframe src="iam-app/index.html" title="iam-app coverage"></iframe></section>
        <section><header><h2>market-data-app</h2><a href="market-data-app/index.html" target="_blank">Open full report</a></header><iframe src="market-data-app/index.html" title="market-data-app coverage"></iframe></section>
        <section><header><h2>order-app</h2><a href="order-app/index.html" target="_blank">Open full report</a></header><iframe src="order-app/index.html" title="order-app coverage"></iframe></section>
        <section><header><h2>reporting-app</h2><a href="reporting-app/index.html" target="_blank">Open full report</a></header><iframe src="reporting-app/index.html" title="reporting-app coverage"></iframe></section>
    </main>
</body>
</html>
