<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leap Laugh Love Documentation</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--background); color: var(--foreground); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
        main { max-width: 760px; margin: 0 auto; padding: 96px 24px; }
        .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: 12px; }
        h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 40px; line-height: 1.15; margin-bottom: 10px; }
        .lede { color: var(--muted-foreground); margin-bottom: 40px; }
        .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        a.card { display: block; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); color: inherit; text-decoration: none; transition: background .2s, border-color .2s; }
        a.card:hover { background: var(--surface-hover); border-color: var(--primary); }
        a.card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .card p { font-size: 14px; color: var(--muted-foreground); }
        ::selection { background: var(--primary); color: var(--background); }
    </style>
</head>
<body>
    <main>
        <div class="eyebrow">Leap Laugh Love</div>
        <h1>Documentation</h1>
        <p class="lede">API reference and test coverage for the backend services.</p>
        <div class="cards">
            <a class="card" href="javadoc/index.html">
                <h2>Javadoc</h2>
                <p>API documentation for every module.</p>
            </a>
            <a class="card" href="jacoco/index.html">
                <h2>Code coverage</h2>
                <p>JaCoCo reports, one per service.</p>
            </a>
        </div>
    </main>
</body>
</html>
