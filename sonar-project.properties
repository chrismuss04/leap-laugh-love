# SonarQube analysis settings, read by sonar-scanner from the repo root (Jenkinsfile
# "SonarQube Analysis" stage). The server URL and token come from Jenkins' withSonarQubeEnv,
# never from this file.
sonar.projectKey=LeapLaughLove-Project
sonar.projectName=LeapLaughLove-Project
sonar.sourceEncoding=UTF-8

# Production code: the five Maven modules, the Angular app and the reporting ETL.
sonar.sources=\
  common-security/src/main,\
  iam-app/src/main,\
  account-app/src/main,\
  order-app/src/main,\
  market-data-app/src/main,\
  frontend/src,\
  reporting-etl/reporting_etl
# Angular specs sit beside the code they test, so they are carved out of the sources here
# and picked up as tests below.
sonar.exclusions=**/*.spec.ts,frontend/src/testing/**

# Test code: JUnit suites, Angular specs and the Playwright suite.
sonar.tests=\
  common-security/src/test,\
  iam-app/src/test,\
  account-app/src/test,\
  order-app/src/test,\
  market-data-app/src/test,\
  frontend/src,\
  e2e,\
  reporting-etl/tests
sonar.test.inclusions=**/src/test/**,frontend/src/**/*.spec.ts,frontend/src/testing/**,e2e/**,reporting-etl/tests/**
sonar.test.exclusions=**/node_modules/**,e2e/playwright-report/**,e2e/test-results/**,e2e/results/**

# Java: compiled classes from "mvn test", and the per-module JaCoCo reports it writes.
sonar.java.source=21
sonar.java.binaries=\
  common-security/target/classes,\
  iam-app/target/classes,\
  account-app/target/classes,\
  order-app/target/classes,\
  market-data-app/target/classes
sonar.java.test.binaries=\
  common-security/target/test-classes,\
  iam-app/target/test-classes,\
  account-app/target/test-classes,\
  order-app/target/test-classes,\
  market-data-app/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=\
  common-security/target/site/jacoco/jacoco.xml,\
  iam-app/target/site/jacoco/jacoco.xml,\
  account-app/target/site/jacoco/jacoco.xml,\
  order-app/target/site/jacoco/jacoco.xml,\
  market-data-app/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=\
  common-security/target/surefire-reports,\
  iam-app/target/surefire-reports,\
  account-app/target/surefire-reports,\
  order-app/target/surefire-reports,\
  market-data-app/target/surefire-reports

# TypeScript: Vitest's lcov report (frontend/angular.json writes repo-relative paths).
sonar.javascript.lcov.reportPaths=frontend/coverage/leap-laugh-love-frontend/lcov.info

# Python (reporting-etl): pytest's report and coverage from the Unit Tests stage, run from the
# repo root so their paths resolve from here.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=reporting-etl/coverage.xml
sonar.python.xunit.reportPath=reporting-etl/test-results/junit.xml
